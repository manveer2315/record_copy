name: Google Sheet backup

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-sheet-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Google API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-auth==2.50.0 google-api-python-client==2.198.0

      - name: Configure Google Drive credentials
        env:
          GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          token_json = os.environ.get("GOOGLE_DRIVE_TOKEN_JSON")
          if not token_json:
              raise SystemExit(
                  "Add GOOGLE_DRIVE_TOKEN_JSON to repository Actions secrets."
              )
          token_path = Path.home() / ".sales_onboarding_app" / "google_drive_token.json"
          token_path.parent.mkdir(parents=True, exist_ok=True)
          token_path.write_text(token_json, encoding="utf-8")
          token_path.chmod(0o600)
          PY

      - name: Replace latest backup and grant Tushar editor access
        env:
          SALES_SPREADSHEET_ID: ${{ secrets.SALES_SPREADSHEET_ID }}
          TUSHAR_EMAIL: Tushar@orangetechshipping.com
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          spreadsheet_id = os.environ.get("SALES_SPREADSHEET_ID", "").strip()
          tushar_email = os.environ["TUSHAR_EMAIL"].strip()
          if not spreadsheet_id:
              raise SystemExit(
                  "Add SALES_SPREADSHEET_ID to repository Actions secrets."
              )

          token_path = Path.home() / ".sales_onboarding_app" / "google_drive_token.json"
          drive_scope = "https://www.googleapis.com/auth/drive"
          credentials = Credentials.from_authorized_user_file(str(token_path))
          if not credentials.has_scopes([drive_scope]):
              raise RuntimeError(
                  "The saved token needs Google Drive scope. Reauthorize Drive access "
                  "and update GOOGLE_DRIVE_TOKEN_JSON."
              )
          if credentials.expired:
              if not credentials.refresh_token:
                  raise RuntimeError("Google token expired and has no refresh token.")
              credentials.refresh(Request())

          drive = build("drive", "v3", credentials=credentials, cache_discovery=False)
          source = drive.files().get(
              fileId=spreadsheet_id,
              fields="name,parents",
              supportsAllDrives=True,
          ).execute()
          backup_prefix = f"{source['name']} - Backup"
          backup_name = backup_prefix
          body = {"name": backup_name}
          parents = source.get("parents")
          if parents:
              body["parents"] = parents

          # Create and grant access first; old backups remain if either fails.
          backup = drive.files().copy(
              fileId=spreadsheet_id,
              body=body,
              fields="id,name,webViewLink",
              supportsAllDrives=True,
          ).execute()
          backup_id = backup["id"]

          permissions = drive.permissions().list(
              fileId=backup_id,
              fields="permissions(id,emailAddress,role,type,permissionDetails(inherited))",
              supportsAllDrives=True,
          ).execute().get("permissions", [])
          existing = next(
              (
                  permission for permission in permissions
                  if permission.get("type") == "user"
                  and permission.get("emailAddress", "").casefold() == tushar_email.casefold()
              ),
              None,
          )
          if existing and existing.get("role") in ("writer", "owner"):
              pass
          elif existing and not any(
              detail.get("inherited", False)
              for detail in existing.get("permissionDetails", [])
          ):
              drive.permissions().update(
                  fileId=backup_id,
                  permissionId=existing["id"],
                  body={"role": "writer"},
                  fields="id,emailAddress,role",
                  supportsAllDrives=True,
              ).execute()
          else:
              drive.permissions().create(
                  fileId=backup_id,
                  body={"type": "user", "role": "writer", "emailAddress": tushar_email},
                  sendNotificationEmail=True,
                  supportsAllDrives=True,
              ).execute()

          # Remove prior timestamped and fixed-name copies from this Drive folder.
          escaped_prefix = backup_prefix.replace("\\", "\\\\").replace("'", "\\'")
          query = (
              f"name contains '{escaped_prefix}' and "
              "mimeType = 'application/vnd.google-apps.spreadsheet' and trashed = false"
          )
          parent_ids = parents or ["root"]
          query += " and (" + " or ".join(
              f"'{parent_id}' in parents" for parent_id in parent_ids
          ) + ")"
          page_token = None
          old_backups = []
          while True:
              response = drive.files().list(
                  q=query,
                  pageSize=1000,
                  pageToken=page_token,
                  fields="nextPageToken,files(id,name)",
                  supportsAllDrives=True,
                  includeItemsFromAllDrives=True,
              ).execute()
              old_backups.extend(
                  item for item in response.get("files", [])
                  if item["id"] != backup_id
                  and item.get("name", "").startswith(backup_prefix)
              )
              page_token = response.get("nextPageToken")
              if not page_token:
                  break

          for old_backup in old_backups:
              drive.files().delete(
                  fileId=old_backup["id"], supportsAllDrives=True
              ).execute()

          timestamp = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
          print(
              f"Backup refreshed at {timestamp}: {backup['name']} "
              f"({backup.get('webViewLink', backup_id)}). "
              f"Granted editor access to {tushar_email}; "
              f"removed {len(old_backups)} prior backup(s)."
          )
          PY

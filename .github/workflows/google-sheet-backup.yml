name: Google Sheet backup

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-sheet-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google API dependencies
        run: python -m pip install google-auth==2.50.0 google-api-python-client==2.198.0

      - name: Copy latest spreadsheet into its Drive folder
        env:
          SALES_SPREADSHEET_ID: ${{ secrets.SALES_SPREADSHEET_ID }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          spreadsheet_id = os.environ["SALES_SPREADSHEET_ID"].strip()
          credentials = Credentials.from_authorized_user_info(
              json.loads(os.environ["GOOGLE_TOKEN_JSON"])
          )
          drive_scope = "https://www.googleapis.com/auth/drive"
          if not credentials.has_scopes([drive_scope]):
              raise RuntimeError(
                  "GOOGLE_TOKEN_JSON must have Google Drive scope. Reauthorize "
                  "Google sign-in with Drive permission and update the GitHub secret."
              )
          if credentials.expired:
              if not credentials.refresh_token:
                  raise RuntimeError("Google token expired and has no refresh token.")
              credentials.refresh(Request())

          drive = build("drive", "v3", credentials=credentials, cache_discovery=False)
          source = drive.files().get(
              fileId=spreadsheet_id,
              fields="name,parents",
              supportsAllDrives=True,
          ).execute()
          timestamp = datetime.now(timezone.utc).strftime("%Y-%m-%d %H-%M-%S UTC")
          body = {"name": f"{source['name']} - Backup - {timestamp}"}
          if source.get("parents"):
              body["parents"] = source["parents"]
          backup = drive.files().copy(
              fileId=spreadsheet_id,
              body=body,
              fields="id,name,webViewLink",
              supportsAllDrives=True,
          ).execute()
          print(f"Created backup: {backup['name']} ({backup.get('webViewLink', backup['id'])})")
          PY
